seed: 42

model:
  name: Qwen3.5-0.8B
  path: ../models/Qwen3.5-0.8B
  device_map: cpu
  torch_dtype: float32
  runtime_backend: cpu
  runtime_device: cpu
  trust_remote_code: true
  local_files_only: true
  attn_implementation: ""

inputs:
  train_split: ../data/processed/alignment_set.jsonl
  val_split: ../data/processed/analysis_val_set.jsonl
  train_targets_dir: ../outputs/qwen35_08b_phase1/student_targets/student_safe_targets_alignment
  val_targets_dir: ../outputs/qwen35_08b_phase1/student_targets/student_safe_targets_val
  pairing_path: ../outputs/qwen35_08b_phase1/layer_pairing/teacher_student_layer_pairs.json
  train_anchor_dir: ../outputs/qwen35_08b_phase1/hidden_states/student_alignment
  val_anchor_dir: ../outputs/qwen35_08b_phase1/hidden_states/student_analysis_val

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  target_modules:
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj

optim:
  epochs: 1
  batch_size: 16
  micro_batch_size: 1
  learning_rate: 0.00005
  weight_decay: 0.0
  sft_loss_weight: 1.0
  layer_loss_weight: 0.5
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler: cosine
  early_stopping_patience: 0
  max_length: 1024
  max_new_tokens: 256
  log_every_steps: 1

target:
  mode: random_same_norm
  random_seed: 2042
  match_l2_norm: true
  layer_loss_policy: harmless_anchor
  harmful_layer_weight: 1.0
  harmless_layer_weight: 0.5
  filter_harmful_targets: true

output:
  output_root: ../outputs/qwen35_08b_phase1/training_random_same_norm
