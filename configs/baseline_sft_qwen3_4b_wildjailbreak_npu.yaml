seed: 42
model:
  name: Qwen3-4B
  path: ../models/Qwen3-4B
  chat_template_enable_thinking: false
  device_map: auto
  torch_dtype: float32
  runtime_backend: npu
  runtime_device: npu:0
  trust_remote_code: true
  local_files_only: true
  attn_implementation: ''
data:
  train_split: ../data/processed/safety/wildjailbreak_20k_train.jsonl
  val_split: ../data/processed/analysis_val_set.jsonl
  test_split: ../data/processed/eval/wildjailbreak_test.jsonl
  safety_dataset:
    name: wildjailbreak
    source_name: allenai/wildjailbreak
    split: train
    force_rebuild: false
    train_subset_mode: true
    max_train_samples: 20000
    max_train_samples_per_label: 10000
    eval_subset_mode: false
    max_eval_samples: 0
    max_eval_samples_per_label: 0
    eval_output_path: ../data/processed/eval/wildjailbreak_test.jsonl
lora:
  rank: 8
  alpha: 8.0
  dropout: 0.05
  target_modules:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.o_proj
  - mlp.gate_proj
  - mlp.up_proj
  - mlp.down_proj
optim:
  epochs: 3
  batch_size: 128
  micro_batch_size: 1
  learning_rate: 1.0e-06
  weight_decay: 0.05
  warmup_ratio: 0.05
  max_grad_norm: 0.5
  lr_scheduler: cosine
  early_stopping_patience: 0
  max_length: 2048
  max_new_tokens: 256
  log_every_steps: 10
  gradient_checkpointing: true
  save_optimizer_state: false
output:
  output_root: ../outputs/baselines/sft_qwen3_4b_wildjailbreak_npu
training:
  mode: full_finetune
