seed: 42
model:
  name: Qwen3-0.6B
  path: ../models/Qwen3-0.6B
  device_map: ''
  torch_dtype: float32
  runtime_backend: npu
  runtime_device: npu:0
  trust_remote_code: true
  local_files_only: true
  attn_implementation: ''
inputs:
  train_split: ../data/processed/train_set.jsonl
  val_split: ../data/processed/analysis_val_set.jsonl
  train_targets_dir: ../outputs/qwen3_4b_to_06b_phase1_npu/student_targets/student_safe_targets_alignment
  val_targets_dir: ../outputs/qwen3_4b_to_06b_phase1_npu/student_targets/student_safe_targets_val
  pairing_path: ../outputs/qwen3_4b_to_06b_phase1_npu/layer_pairing/teacher_student_layer_pairs.json
  train_anchor_dir: ''
  val_anchor_dir: ''
lora:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  target_modules:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.o_proj
  - mlp.gate_proj
  - mlp.up_proj
  - mlp.down_proj
optim:
  epochs: 3
  batch_size: 16
  micro_batch_size: 2
  learning_rate: 0.0003
  weight_decay: 0.0
  sft_loss_weight: 1.0
  layer_loss_weight: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler: cosine
  early_stopping_patience: 0
  max_length: 2048
  max_new_tokens: 256
  log_every_steps: 1
target:
  mode: semantic
  random_seed: 2042
  match_l2_norm: true
  layer_loss_policy: harmful_only
  harmful_layer_weight: 1.0
  harmless_layer_weight: 0.5
  filter_harmful_targets: true
output:
  output_root: ../outputs/qwen3_4b_to_06b_phase1_npu/training_sft1
