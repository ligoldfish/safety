seed: 42
model:
  name: Qwen3.5-0.8B
  path: ../models/Qwen3.5-0.8B
  chat_template_enable_thinking: false
  device_map: ''
  torch_dtype: float32
  runtime_backend: npu
  runtime_device: npu:0
  trust_remote_code: true
  local_files_only: true
  attn_implementation: ''
data:
  train_split: ../data/processed/safety/safety_tuned_llamas_train.jsonl
  val_split: ../data/processed/analysis_val_set.jsonl
  test_split: ../data/processed/pan_test_set.jsonl
  safety_dataset:
    name: safety_tuned_llamas
    repo_or_data_path: ../external/safety-tuned-llamas
    file_name: safety_only_data_Instructions.json
    include_harmless_contrast: true
    harmless_file_name: alpaca_small.json
    harmless_max_samples: 0  # 0 = auto-balance to harmful count
    force_rebuild: false
    eval_output_path: ../data/processed/safety/safety_tuned_llamas_eval.jsonl
    eval_holdout_fraction: 0.1
lora:
  rank: 8
  alpha: 8.0
  dropout: 0.05
  target_modules:
  - self_attn.v_proj
  - self_attn.o_proj
optim:
  epochs: 8
  batch_size: 32
  micro_batch_size: 1
  learning_rate: 5.0e-06
  weight_decay: 0.05
  warmup_ratio: 0.05
  max_grad_norm: 0.5
  lr_scheduler: cosine
  early_stopping_patience: 0
  max_length: 1024
  max_new_tokens: 256
  log_every_steps: 10
  gradient_checkpointing: true
  save_optimizer_state: false
output:
  output_root: ../outputs/baselines/sft_qwen35_08b_safety_tuned_llamas_npu
training:
  mode: full_finetune
