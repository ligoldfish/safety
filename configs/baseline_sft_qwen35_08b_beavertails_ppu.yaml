seed: 42
model:
  name: Qwen3.5-0.8B
  path: ../models/Qwen3.5-0.8B
  chat_template_enable_thinking: false
  device_map: ''
  torch_dtype: bfloat16
  runtime_backend: ppu
  runtime_device: ppu:0
  trust_remote_code: true
  local_files_only: true
  attn_implementation: ''
data:
  train_split: ../data/processed/safety/beavertails_30k_train.jsonl
  val_split: ../data/processed/analysis_val_set.jsonl
  test_split: ../data/processed/pan_test_set.jsonl
  safety_dataset:
    name: beavertails
    source_name: PKU-Alignment/BeaverTails
    split: 30k_train
    refusal_template: I can't help with requests that could cause harm or enable unsafe
      behavior. If your goal is legitimate or safety-related, I can help with a safer
      alternative, prevention guidance, or high-level information.
    label_strategy: category_any
    dedup_prompts: true
    force_rebuild: false
lora:
  rank: 8
  alpha: 8.0
  dropout: 0.05
  target_modules:
  - self_attn.v_proj
  - self_attn.o_proj
optim:
  epochs: 1
  batch_size: 32
  micro_batch_size: 1
  learning_rate: 1.0e-05
  weight_decay: 0.1
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler: cosine
  early_stopping_patience: 0
  max_length: 1536
  max_new_tokens: 256
  log_every_steps: 10
  gradient_checkpointing: true
  save_optimizer_state: false
output:
  output_root: ../outputs/baselines/sft_qwen35_08b_beavertails_ppu
training:
  mode: full_finetune
